# Reverse proxy: public port 80/443 -> Streamlit on 127.0.0.1:8501
# Replace the server_name with YOUR DuckDNS domain before using.
# certbot --nginx will automatically add the TLS (443) block + HTTP->HTTPS redirect.
server {
    listen 80;
    server_name mihad-litter.duckdns.org;

    client_max_body_size 25M;   # allow reasonably large image uploads

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Required for Streamlit's websocket (live updates / spinner).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;   # keep long-lived websockets open
    }
}
